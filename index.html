<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1-Click Payment Gateway & Catalog Installer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <h1 class="text-2xl font-bold mb-2">1-Click Payment Bridge & Bulk Catalog</h1>
    <p class="text-slate-400 text-sm mb-6">Connect Stripe, Paddle, or Lemon Squeezy, upload your product CSV, and generate your checkout links instantly.</p>

    <form id="setupForm" class="space-y-4">
      <!-- Gateway Selection -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">1. Select Payment Gateway</label>
        <select id="gateway" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
          <option value="stripe">Stripe</option>
          <option value="paddle">Paddle (Sandbox/Billing v2)</option>
          <option value="lemonsqueezy">Lemon Squeezy</option>
        </select>
      </div>

      <!-- API Key -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">2. Gateway Secret API Key</label>
        <input type="password" id="api_key" placeholder="sk_test_... or pdl_sdbx_..." required
          class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500" />
      </div>

      <!-- CSV Catalog Uploader -->
      <div class="pt-2 border-t border-slate-800">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">3. Upload Product Catalog (CSV)</label>
        <input type="file" id="csvFile" accept=".csv" required
          class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" />
        <p class="text-[10px] text-slate-500 mt-1">Supports your Products CSV export (maps <code class="text-indigo-400">Product Name</code>, <code class="text-indigo-400">Price</code> automatically)</p>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-lg transition mt-4">
        Process Bulk Products & Link Webhooks
      </button>
    </form>

    <!-- Output Box -->
    <div id="resultBox" class="hidden mt-6 pt-6 border-t border-slate-800">
      <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400">✓ Bulk Catalog Provisioned Successfully!</span>
      <textarea id="embedCode" rows="6" readonly
        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-xs text-indigo-300 mt-2"></textarea>
    </div>
  </div>

  <script>
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, '').toLowerCase());
      const result = [];

      for (let i = 1; i < lines.length; i++) {
        const currentline = lines[i].split(',').map(val => val.trim().replace(/^["']|["']$/g, ''));
        if (currentline.length >= headers.length) {
          let obj = {};
          headers.forEach((header, index) => {
            obj[header] = currentline[index];
          });
          result.push(obj);
        }
      }
      return result;
    }

    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Parsing CSV & Provisioning...';
      btn.disabled = true;

      const fileInput = document.getElementById('csvFile');
      const file = fileInput.files[0];
      const text = await file.text();
      const rawProducts = parseCSV(text);

      // Map whatever columns your CSV has into the exact format n8n expects
      const formattedProducts = rawProducts.map(p => ({
        product_name: p.product_name || p['product name'] || p.name || 'Unnamed Product',
        price_usd: parseFloat((p.price || p.price_usd || '0').replace(/[^0-9.]/g, '')) || 0,
        interval: p.interval || (p.type && p.type.toLowerCase().includes('physical') ? 'one-time' : 'month')
      }));

      const N8N_PROVISION_WEBHOOK = 'https://atmaja.app.n8n.cloud/webhook/provision-gateway';

      const payload = {
        gateway: document.getElementById('gateway').value,
        api_key: document.getElementById('api_key').value,
        products: formattedProducts
      };

      try {
        const res = await fetch(N8N_PROVISION_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        document.getElementById('embedCode').value = JSON.stringify(data, null, 2);
        document.getElementById('resultBox').classList.remove('hidden');
      } catch (err) {
        alert('Error connecting to n8n webhook.');
      } finally {
        btn.textContent = 'Process Bulk Products & Link Webhooks';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
